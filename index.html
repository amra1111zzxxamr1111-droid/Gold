<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Saga ERP - Amr Systems</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg-emerald: #010705; --panel-emerald: #04140f; --input-bg: #062017; --rose-gold: #ffb380; --gold-warm: #ecc94b; --text-light: #e6f4f0; --border-emerald: #0d382c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-emerald); color: var(--text-light); padding-bottom: 100px; min-height: 100vh; }
        .app-grid { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 25px; }
        .panel-box { background-color: var(--panel-emerald); border-radius: 14px; border: 1px solid var(--border-emerald); padding: 25px; }
        .btn-prime { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--rose-gold), #cc7a47); border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; }
        .casio-frame { background: #111a17; padding: 15px; border-radius: 12px; border: 2px solid #000; }
        .casio-lcd { background: #8fa097; color: #000; font-family: 'Orbitron'; font-size: 1.5rem; padding: 10px; margin-bottom: 10px; text-align: left; }
        .casio-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .btn-calc { background: #202b27; color: white; padding: 10px; border: none; cursor: pointer; }
        #render-zone { position: fixed; left: -9999px; background: #fff; color: #000; padding: 30px; width: 350px; text-align: center; }
    </style>
</head>
<body>

    <div class="app-grid">
        <!-- قسم الكاشير المدمج -->
        <div id="sec-cashier" class="panel-box">
            <h2><i class="fa-solid fa-cash-register"></i> بوابة المبيعات المتطورة</h2>
            <div style="display: grid; grid-template-columns: 1fr 300px; gap: 20px;">
                <div>
                    <div class="form-group"><label>الوزن (جرام)</label><input type="number" id="in-weight" step="0.001"></div>
                    <div class="form-group"><label>سعر الجرام الحالي</label><input type="number" id="in-live-price"></div>
                    <div class="form-group"><label>المصنعية</label><input type="number" id="in-work"></div>
                    <button class="btn-prime" onclick="finalizeInvoice()">تصدير الفاتورة PNG</button>
                </div>
                
                <div class="casio-frame">
                    <div class="casio-lcd" id="lbl-out">0</div>
                    <div class="casio-btns">
                        <button class="btn-calc" onclick="addC('7')">7</button><button class="btn-calc" onclick="addC('8')">8</button><button class="btn-calc" onclick="addC('9')">9</button><button class="btn-calc" onclick="delC()">C</button>
                        <button class="btn-calc" onclick="addC('4')">4</button><button class="btn-calc" onclick="addC('5')">5</button><button class="btn-calc" onclick="addC('6')">6</button><button class="btn-calc" onclick="addC('*')">×</button>
                        <button class="btn-calc" onclick="addC('1')">1</button><button class="btn-calc" onclick="addC('2')">2</button><button class="btn-calc" onclick="addC('3')">3</button><button class="btn-calc" onclick="addC('-')">-</button>
                        <button class="btn-calc" onclick="addC('0')">0</button><button class="btn-calc" onclick="addC('.')">.</button><button class="btn-calc" onclick="eqC()">=</button><button class="btn-calc" onclick="addC('+')">+</button>
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <button class="btn-calc" style="flex:1" onclick="sendTo('in-weight')">لـ الوزن</button>
                        <button class="btn-calc" style="flex:1" onclick="sendTo('in-live-price')">لـ السعر</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="sec-profits" class="panel-box">
            <h2><i class="fa-solid fa-shield-halved"></i> التقارير السحابية</h2>
            <button class="btn-prime" onclick="genReport()">تقرير الإقفال PNG</button>
        </div>
    </div>

    <!-- منطقة تصدير الصور -->
    <div id="render-zone">
        <h2 id="r-title">مجوهرات الهدى</h2>
        <div id="r-body" style="font-size:1.2rem; margin: 20px 0;"></div>
    </div>

    <script>
        const FB_URL = "https://amr1-a9154-default-rtdb.firebaseio.com/";
        const SHOP_KEY = "al_hoda_branch_minya";
        let buffer = "";

        // حاسبة متطورة
        function addC(v) { buffer += v; document.getElementById('lbl-out').innerText = buffer; }
        function delC() { buffer = ""; document.getElementById('lbl-out').innerText = "0"; }
        function eqC() { try { buffer = eval(buffer).toString(); document.getElementById('lbl-out').innerText = buffer; } catch { buffer = "خطأ"; } }
        function sendTo(id) { document.getElementById(id).value = buffer; }

        // فاتورة + ربط Firebase
        async function finalizeInvoice() {
            const w = parseFloat(document.getElementById('in-weight').value) || 0;
            const p = parseFloat(document.getElementById('in-live-price').value) || 0;
            const m = parseFloat(document.getElementById('in-work').value) || 0;
            const total = (w * p) + m;

            // تحديث المخزن في Firebase
            try {
                let res = await fetch(`${FB_URL}shops/${SHOP_KEY}/inventory_state.json`);
                let inv = await res.json();
                inv.gold21 = (inv.gold21 || 0) - w;
                inv.cash = (inv.cash || 0) + total;
                await fetch(`${FB_URL}shops/${SHOP_KEY}/inventory_state.json`, { method: "PUT", body: JSON.stringify(inv) });
            } catch(e) { console.log("مزامنة أوفلاين"); }

            document.getElementById('r-title').innerText = "فاتورة بيع";
            document.getElementById('r-body').innerHTML = `الوزن: ${w} جم<br>سعر الجرام: ${p} ج.م<br>المصنعية: ${m} ج.م<hr><h3>الإجمالي: ${total.toFixed(2)} ج.م</h3>`;
            exportPNG("Invoice_" + Date.now() + ".png");
        }

        // تقرير إقفال
        function genReport() {
            document.getElementById('r-title').innerText = "تقرير إقفال الوردية";
            document.getElementById('r-body').innerHTML = `التاريخ: ${new Date().toLocaleDateString('ar-EG')}<br>تم إقفال الوردية وتحديث السيرفر بنجاح.`;
            exportPNG("Shift_Report.png");
        }

        function exportPNG(name) {
            html2canvas(document.getElementById('render-zone')).then(canvas => {
                let a = document.createElement('a');
                a.download = name;
                a.href = canvas.toDataURL("image/png");
                a.click();
            });
        }
    </script>
</body>
</html>
